kind = "mobile"
previewPath = "/pinduoduo-translator/"
title = "Pinduoduo Русский Браузер"
description = "Native Android browser for the live Pinduoduo mobile site, with on-device Chinese-to-Russian translation of page text."
version = "1.0.0"
id = "artifacts/pinduoduo-translator"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/pinduoduo-translator/" ]
localPort = 22630

[services.development]
run = "pnpm --filter @workspace/pinduoduo-translator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pinduoduo-translator", "run", "build" ]
run = [ "node", "server/serve.js" ]

[services.env]
PORT = "22630"
BASE_PATH = "/pinduoduo-translator/"
