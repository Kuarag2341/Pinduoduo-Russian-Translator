kind = "mobile"
previewPath = "/pinduoduo-translator/"
title = "Pinduoduo Russian Translator"
description = "Android companion app that captures the user's screen only after permission, recognizes Chinese text locally, translates it into Russian, and shows a touch-through overlay above Pinduoduo."
version = "1.0.0"
id = "artifacts/pinduoduo-translator"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/pinduoduo-translator/" ]
localPort = 22630

[services.development]
run = "pnpm --filter @workspace/pinduoduo-translator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pinduoduo-translator", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pinduoduo-translator", "run", "serve" ]

[services.env]
PORT = "22630"
BASE_PATH = "/pinduoduo-translator/"
