name: Pinduoduo Russian Browser Android

on:
  push:
    paths:
      - "pinduoduo-russian-browser-source.zip"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "pinduoduo-russian-browser-source.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Extract native Android source
        run: |
          test -f pinduoduo-russian-browser-source.zip
          unzip -o -q pinduoduo-russian-browser-source.zip \
            'artifacts/pinduoduo-translator/native-android/*' \
            -d .
          test -f artifacts/pinduoduo-translator/native-android/settings.gradle.kts
          test -f artifacts/pinduoduo-translator/native-android/app/build.gradle.kts
          test -f artifacts/pinduoduo-translator/native-android/app/src/main/assets/pdd_translator.js

      - name: Assemble debug APK
        working-directory: artifacts/pinduoduo-translator/native-android
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pinduoduo-russian-browser-debug-apk
          path: artifacts/pinduoduo-translator/native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
